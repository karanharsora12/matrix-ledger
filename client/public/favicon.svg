<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ml-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="45%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="ml-chevron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="ml-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="ml-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#ml-bg)"/>
  
  <!-- Subtle border highlight -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="8"/>

  <!-- Matrix subtle grid dots (representing digital matrix) -->
  <g opacity="0.18">
    <circle cx="100" cy="90" r="10" fill="#ffffff"/>
    <circle cx="170" cy="90" r="10" fill="#ffffff"/>
    <circle cx="256" cy="90" r="10" fill="#ffffff"/>
    <circle cx="342" cy="90" r="10" fill="#ffffff"/>
    <circle cx="412" cy="90" r="10" fill="#ffffff"/>

    <circle cx="100" cy="422" r="10" fill="#ffffff"/>
    <circle cx="170" cy="422" r="10" fill="#ffffff"/>
    <circle cx="256" cy="422" r="10" fill="#ffffff"/>
    <circle cx="342" cy="422" r="10" fill="#ffffff"/>
    <circle cx="412" cy="422" r="10" fill="#ffffff"/>
  </g>

  <!-- Monogram Logo "ML" -->
  <g filter="url(#ml-glow)">
    <!-- "M" Left Stem -->
    <rect x="108" y="140" width="52" height="232" rx="14" fill="#ffffff"/>

    <!-- "M" Center Chevron Peaks -->
    <path d="M152 148 L256 268 L360 148 C366 141 376 143 380 150 L394 172 C398 178 397 186 391 192 L274 316 C264 326 248 326 238 316 L121 192 C115 186 114 178 118 172 L132 150 C136 143 146 141 152 148 Z" fill="url(#ml-chevron)"/>

    <!-- "M" Right Stem -->
    <rect x="352" y="140" width="52" height="150" rx="14" fill="#ffffff"/>

    <!-- "L" Horizontal Base (Ledger Shelf) -->
    <rect x="220" y="320" width="184" height="52" rx="14" fill="#ffffff"/>

    <!-- Clear Hisab Accent Node (Balanced Green Dot) -->
    <circle cx="378" cy="225" r="22" fill="url(#ml-emerald)" stroke="#ffffff" stroke-width="5"/>
  </g>
</svg>
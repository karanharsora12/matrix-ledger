services:
  - type: web
    name: matrix-ledger-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace=server
    startCommand: npm start --workspace=server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: matrix-ledger-db
          property: connectionString
      - key: CLIENT_URL
        sync: false

databases:
  - name: matrix-ledger-db
    plan: free
    databaseName: matrix_ledger
    user: matrix_ledger_user
